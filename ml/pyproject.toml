[project]
name = "kipml"
version = "0.1.0"
description = "Kip's handling-noise filter: data mixing, model, training, inference and ONNX export"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "torch==2.7.1",
  "onnx==1.18.0",
  "onnxruntime==1.22.0",
  "matplotlib==3.10.3",
]

[dependency-groups]
dev = [
    "ipykernel==6.30.1",
    "nbconvert==7.16.6",
    "pytest==8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
